# CAS AI for Business — Day 6 of 6.
# Source: _events/CAS_GenAI_2026_Tagesstruktur_V2.xlsx ("Übersicht" + "Tag 6").
#
# Conventions:
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Lab labels follow the course numbering: 01-13 for the main track and
#     C01/C04/C06/C07 for the custom labs authored for this course.
#   * No theory blocks on this day: participants implement the use case they
#     scoped during the week and close with final presentations.
#   * Lab C07 (Save Your Work) sits deliberately at the end of the course —
#     the lab environment is torn down afterwards, so this is the last chance
#     to export the agents and workflows built over the six days.

