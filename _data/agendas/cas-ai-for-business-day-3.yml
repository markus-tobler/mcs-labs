    time: "10:45"
    duration: 15

  - type: lab
    slug: workflow-email-triage
    label: "Lab C06"
    title: "Workflow-Based Email Triage"
    time: "11:00"
    duration: 60

  - type: break
    title: "Lunch break"
    time: "12:00"
    duration: 45

  - type: session
    title: "Theory: Use case development"
    time: "12:45"
    duration: 10

  - type: session
    title: "Hackathon prep 3: Job design"
    time: "12:55"
