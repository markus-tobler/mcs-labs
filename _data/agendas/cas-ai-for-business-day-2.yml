# CAS AI for Business — Day 2 of 6.
# Source: _events/CAS_GenAI_2026_Tagesstruktur_V2.xlsx ("Übersicht" + "Tag 2").
#
# Conventions:
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Lab labels follow the course numbering: 01-13 for the main track and
#     C01/C04/C06 for the custom labs authored for this course.
#   * Didactic principle (flipped classroom at lab level): each lab opens with
#     a short instructor intro, participants then work through the lab, and a
#     theory block follows to consolidate what they just built.
#   * Lab 03c closes out the Build Intelligent Agents lab that started on
#     Day 1 (03a/03b), anchoring the RAG/knowledge-sources theory that follows.
#   * Backup/filler labs (not part of the timed schedule below): «Ask Me
#     Anything» (ask-me-anything, two parts, ~45+55 min) and Proactive
#     Contract Alerts (contract-alerts-azure-ai, ~40 min). Use them to fill
#     gaps that open up in Block 1.

schedule:
