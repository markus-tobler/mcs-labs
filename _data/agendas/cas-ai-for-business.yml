    label: "Lab 13"
    title: "Autonomous Account News"
    time: "13:00"
    duration: 40

  - type: session
    title: "Day 4 wrap-up & Q&A"
    time: "13:40"
    duration: 20

  # --- Day 5 — Bring your own model and extension labs -------------------
  - type: day
    title: "Day 5 — Bring Your Own Model & Extension Labs"

  - type: lab
    slug: mcs-byom
    label: "Lab 14"
    title: "BYOM (Bring Your Own Model)"
    time: "09:00"
    duration: 50

  - type: break
    title: "Coffee break"
    time: "09:50"
    duration: 15

  - type: lab
    slug: sequential-multi-agent
    label: "Lab C02"
    title: "Sequential Multi-Agent Product Developer"
