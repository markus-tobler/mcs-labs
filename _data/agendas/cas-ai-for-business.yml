event_id: cas-ai-for-business

# CAS AI for Business — 5-day agenda.
#
# Conventions:
#   * "lab" rows reference _labs/<slug>.md. `duration:` overrides the lab's own.
#   * Lab labels follow the course numbering: 01-14 for the main track and
#     C01-C06 for the custom labs authored for this course.
#   * Labs 03a and 03b are the two halves of the ask-me-anything lab
#     (use cases 1-4 and 5-7). They share one slug and are split across the
#     day by the MCP server lab that sits between them.
#   * Lab 08 (deploy your own MCP server) has no page in _labs/ and is carried
#     as a "link" row pointing at the microsoft/mcsmcp repository.
#   * Day 5 runs the BYOM lab and then the three optional extension labs
#     (C02, C03, C04). Drop the extension block for a four-and-a-half-day
#     delivery without touching the rest of the schedule.

schedule:
  # --- Day 1 — Declarative agents, the platform, and core concepts --------
  - type: day
    title: "Day 1 — Declarative Agents, the Platform & Core Concepts"

  - type: session
    title: "Welcome & orientation"
    description: "Course goals, lab environment, tenant setup, and how the hands-on flow works across the five days."
    label: "Intro"
    time: "09:00"
    duration: 30

  - type: lab
    slug: agent-builder-m365
    label: "Lab 01"
    title: "Progressive AI Assistants"
    time: "09:30"
    duration: 40

  - type: break
    title: "Coffee break"
    time: "10:10"
    duration: 15

  - type: lab
    slug: explore-power-platform
    label: "Lab C01"
    title: "Explore the Power Platform"
    time: "10:25"
    duration: 30

  - type: lab
    slug: mbr-prep-sharepoint-agent
    label: "Lab 02"
    title: "Monthly Business Review Agent"
    time: "10:55"
    duration: 45

  - type: break
    title: "Lunch break"
    time: "11:40"
    duration: 60

  - type: lab
    slug: core-concepts-agent-knowledge-tools
    label: "Lab 03"
    title: "Build Intelligent Agents — Knowledge Sources, Tools, Topics"
    time: "12:40"
    duration: 45

  - type: session
    title: "Day 1 wrap-up & Q&A"
    time: "13:25"
    duration: 20

  # --- Day 2 — Variables, data, evaluation, and multi-agent ---------------
  - type: day
    title: "Day 2 — Variables, Data, Evaluation & Multi-Agent"

  - type: lab
    slug: core-concepts-variables-agents-channels
    label: "Lab 04"
    title: "Variables, Multi-Agent Architectures, Channel Deployment"
    time: "09:00"
    duration: 40

  - type: lab
    slug: dataverse-mcp-connector
    label: "Lab 05"
    title: "Dataverse MCP Connector"
    time: "09:40"
    duration: 50

  - type: break
    title: "Coffee break"
    time: "10:30"
    duration: 15

  - type: lab
    slug: core-concepts-analytics-evaluations
    label: "Lab 06"
    title: "Analytics and Evaluation"
    time: "10:45"
    duration: 50

  - type: lab
    slug: mcs-multi-agent
    label: "Lab 07a"
    title: "Multi-Agent"
    time: "11:35"
    duration: 50

  - type: break
    title: "Lunch break"
    time: "12:25"
    duration: 60

  - type: lab
    slug: workflow-email-triage
    label: "Lab C06"
    title: "Workflow-Based Email Triage"
    time: "13:25"
    duration: 40

  - type: session
    title: "Day 2 wrap-up & Q&A"
    time: "14:05"
    duration: 20

  # --- Day 3 — Workflows, skills, orchestration, and MCP ------------------
  - type: day
    title: "Day 3 — Workflows, Skills, Orchestration & MCP"

  - type: lab
    slug: mcs-workflows
    label: "Lab 07b"
    title: "Workflows"
    time: "09:00"
    duration: 60

  - type: break
    title: "Coffee break"
    time: "10:00"
    duration: 15

  - type: lab
    slug: mcs-skills
    label: "Lab 07c"
    title: "Skills"
    time: "10:15"
    duration: 45

  - type: lab
    slug: mcs-orchestration
    label: "Lab 07d"
    title: "Orchestration"
    time: "11:00"
    duration: 60

  - type: break
    title: "Lunch break"
    time: "12:00"
    duration: 60

  - type: lab
    slug: ask-me-anything
    label: "Lab 03a"
    title: "«Ask Me Anything» Agent — Part 1 (UC 1-4)"
    time: "13:00"
    duration: 45

  - type: link
    title: "Lab 08 — Deploy your own MCP server"
    url: "https://github.com/microsoft/mcsmcp"
    description: "Deploy a custom MCP server and integrate it with Microsoft Copilot Studio for streamlined deployment and management."
    time: "13:45"
    duration: 60

  - type: break
    title: "Coffee break"
    time: "14:45"
    duration: 15

  - type: lab
    slug: ask-me-anything
    label: "Lab 03b"
    title: "«Ask Me Anything» Agent — Part 2 (UC 5-7)"
    time: "15:00"
